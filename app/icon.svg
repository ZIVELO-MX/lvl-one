<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0F0D0B"/>

  <!-- D20 die — top facet -->
  <polygon points="16,3 28,10 16,17 4,10" fill="url(#ft)"/>
  <!-- D20 die — right facet -->
  <polygon points="16,17 28,10 28,23 16,29" fill="url(#fr)"/>
  <!-- D20 die — left facet -->
  <polygon points="16,17 4,10 4,23 16,29" fill="url(#fl)"/>

  <!-- Outline strokes -->
  <polygon points="16,3 28,10 16,17 4,10" stroke="#E7C172" stroke-width="0.6" fill="none"/>
  <polygon points="16,17 28,10 28,23 16,29" stroke="#B58A35" stroke-width="0.6" fill="none"/>
  <polygon points="16,17 4,10 4,23 16,29" stroke="#B58A35" stroke-width="0.6" fill="none"/>

  <!-- Center ridge lines -->
  <line x1="16" y1="17" x2="16" y2="29" stroke="#8A6520" stroke-width="0.5"/>
  <line x1="16" y1="17" x2="28" y2="23" stroke="#8A6520" stroke-width="0.5"/>
  <line x1="16" y1="17" x2="4" y2="23" stroke="#8A6520" stroke-width="0.5"/>

  <!-- "1" numeral on top face -->
  <text x="16" y="14" text-anchor="middle" font-family="Georgia,serif" font-size="9" font-weight="700" fill="#0F0D0B" letter-spacing="-0.5">1</text>

  <defs>
    <linearGradient id="ft" x1="16" y1="3" x2="16" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7C172"/>
      <stop offset="1" stop-color="#D6A84F"/>
    </linearGradient>
    <linearGradient id="fr" x1="28" y1="10" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C99A3E"/>
      <stop offset="1" stop-color="#A07828"/>
    </linearGradient>
    <linearGradient id="fl" x1="4" y1="10" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B58A35"/>
      <stop offset="1" stop-color="#8A6520"/>
    </linearGradient>
  </defs>
</svg>
